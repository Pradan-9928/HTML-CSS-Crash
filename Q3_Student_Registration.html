<!--3. Student Registration Form

Scenario: An online coding bootcamp needs a signup form for new applicants to capture their details.

Core Objectives: Master form creation, input types, data capture attributes, and basic form accessibility.

HTML Elements/Attributes: <form>, <label>, <input>, <select>, <option>, <textarea>, <button>, type, for, id, name, placeholder, required.

Key Requirements:

Create labeled input fields for full name, email (type="email"), and password (type="password").

Explicitly link every <label> to its corresponding <input> using for and id.

Include a <select> dropdown for choosing a course track and a <textarea> for a brief statement of purpose.

Add a submit <button> and enforce input validation using the required attribute on key fields.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form>
        <label for="username">UserName</label>
        <input type="text" id="username" placeholder="Enter Username" required>

        <br>
        <br>

        <label for="email">E-Mail</label>
        <input type="email" id="email" placeholder="Enter your Email" required>

        <br>
        <br>

        <label for="dropdown">Year</label>
        <select id="role" name="role">
            <option value="First Year">First Year</option>
            <option value="Second Year">Second Year</option>
            <option value="Third Year">Third Year</option>
            <option value="Fourth Year">Fourth Year</option>
        </select>

        <br>
        <br>

        <label for="password">Password</label>
        <input type="text" id="password" placeholder="Enter your Password" required>

        <br>
        <br>

        <button type="submit">Register</button>

    </form>
    
</body>
</html>
